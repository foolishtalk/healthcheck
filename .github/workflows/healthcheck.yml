name: Hourly health check

on:
  schedule:
    # GitHub Actions cron uses UTC. This runs at the start of every hour.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: Send a test WeCom notification without checking targets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: hourly-health-check
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test ./...

      - name: Check configured services
        if: ${{ github.event_name == 'schedule' || !inputs.test_notification }}
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: go run . -config services.json

      - name: Send test WeCom notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification }}
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: go run . -config services.json -test-notification
